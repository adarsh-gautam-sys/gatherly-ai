minimum_pre_commit_version: '4.7.0'
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (requires v8.30.1)
        entry: make scan-staged
        language: system
        pass_filenames: false
        always_run: true
