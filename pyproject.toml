[build-system]
requires = ["hatchling==1.33.0", "editables==0.6"]
build-backend = "hatchling.build"

[project]
name = "gatherly-ai"
dynamic = ["version"]
description = "A celebration planner with deterministic plans and Gemini-powered ideas."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "bandit==1.9.4",
    "editables==0.6",
    "hatchling==1.33.0",
    "httpx2==2.16.0",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]

[tool.hatch.version]
path = "src/gatherly/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gatherly"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".tools", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --import-mode=importlib --cov=gatherly --cov-report=term-missing --cov-report=xml"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["gatherly"]
relative_files = true

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
